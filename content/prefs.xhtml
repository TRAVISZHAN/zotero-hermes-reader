<!--
	Zotero 设置 → Hermes 阅读助手。

	这是 XUL 片段（`defaultXUL: true`），不是完整文档：默认命名空间是 XUL，
	HTML 标签要写成 `html:`。`oncommand` 属性不会被 parseXULToFragment 接上，
	所以按钮的监听器都在 main.js 的 initPrefPane 里绑定；`onload` 是标准的
	事件处理属性，可以直接用，但它在 prefs 窗口的全局作用域里求值，
	因此入口挂在 `Zotero.HermesReadingAssistantZ9` 上。
-->
<vbox id="hermes-reading-assistant-z9-prefpane"
	onload="Zotero.HermesReadingAssistantZ9.initPrefPane(this)">
	<vbox class="main-section">
		<groupbox aria-label="Hermes 连接">
			<label><html:h2>Hermes 连接</html:h2></label>

			<description>
				地址留空时，插件只连接本机 Hermes Desktop，并自动跟随它的动态端口。
			</description>
			<description>
				要连接另一台机器上的 Hermes，填写局域网或 Tailscale 上的 Relay 地址，例如 http://100.100.100.100:8644。
			</description>

			<hbox align="center">
				<label id="hermes-reading-assistant-z9-endpoint-label"
					value="地址"
					control="hermes-reading-assistant-z9-endpoint"/>
				<html:input type="url"
					id="hermes-reading-assistant-z9-endpoint"
					style="flex: 1;"
					placeholder="留空自动连接本机；或填 http://100.x.x.x:8644"
					aria-labelledby="hermes-reading-assistant-z9-endpoint-label"/>
			</hbox>

			<hbox align="center">
				<label id="hermes-reading-assistant-z9-token-label"
					value="令牌"
					control="hermes-reading-assistant-z9-token"/>
				<html:input type="password"
					id="hermes-reading-assistant-z9-token"
					style="flex: 1;"
					autocomplete="off"
					placeholder="留空则自动读取 Relay 提供的动态令牌"
					aria-labelledby="hermes-reading-assistant-z9-token-label"/>
			</hbox>

			<hbox align="center">
				<button id="hermes-reading-assistant-z9-save" label="保存并连接"/>
				<button id="hermes-reading-assistant-z9-clear" label="清除远程地址"/>
				<spacer flex="1"/>
			</hbox>

			<description id="hermes-reading-assistant-z9-status" style="margin-top: 4px;"/>
		</groupbox>
	</vbox>
</vbox>
